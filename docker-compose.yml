services:
  mediahub:
    image: ghcr.io/a3318375/mediahub:latest
    ports:
      - "5173:18080"
    volumes:
      - ./data:/data
      # Mount existing host libraries read-only at the fixed container paths.
      - type: bind
        source: ./library/comics
        target: /comics
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./library/book
        target: /book
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
