services:
  mediahub:
    image: ghcr.io/a3318375/mediahub:latest
    ports:
      - "5173:18080"
    volumes:
      - ./data:/data
      - ./strm:/strm
      - ./comics:/comics
      - ./download:/download
      - ./book:/book
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
