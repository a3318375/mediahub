name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["hero/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: hero/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: hero
      - run: pnpm build:demo
        working-directory: hero
      - run: pnpm test
        working-directory: hero
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hero/dist-demo
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
