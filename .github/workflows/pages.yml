name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["uiarc/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: uiarc/package-lock.json
      - run: npm ci
        working-directory: uiarc
      - run: npm test
        working-directory: uiarc
      - run: npm run build:demo
        working-directory: uiarc
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: uiarc/dist-demo
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
